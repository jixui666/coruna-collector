name: build-collector

on:
  workflow_dispatch:
  push:
    paths:
      - 'collector/**'
      - '.github/workflows/build-collector.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 18
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget gnupg lsb-release software-properties-common
          wget -qO- https://apt.llvm.org/llvm-script.deb.sh | sudo bash
          sudo apt-get install -y -qq clang-18 lld-18
          clang-18 --version | head -2
          ld64.lld-18 --version || true

      - name: Fetch iPhoneOS SDK
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git sdks
          cd sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          ls -d *.sdk

      - name: Build
        run: |
          SDK="$PWD/sdks/iPhoneOS16.5.sdk"
          set +e
          clang-18 -target arm64e-apple-ios16.0 \
            -isysroot "$SDK" \
            -dynamiclib -fobjc-arc -O2 \
            -fno-constant-cfstrings \
            -fuse-ld=lld-18 \
            -Wl,-undefined,dynamic_lookup \
            -Wl,-platform_version,ios,16.0,16.5 \
            -framework Foundation \
            -framework CoreFoundation \
            -o collector.dylib collector/collector.m > build.log 2>&1
          echo "exit=$?"
          tail -30 build.log

      - name: Inspect
        run: |
          ls -l collector.dylib || echo NO_OUTPUT
          file collector.dylib || true
          xxd -l 16 collector.dylib || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-out
          path: |
            collector.dylib
            build.log