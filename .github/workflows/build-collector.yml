name: build-collector

on:
  workflow_dispatch:
  push:
    paths:
      - 'collector/**'
      - '.github/workflows/build-collector.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang + lld
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld
          clang --version | head -2
          ld.lld --version

      - name: Fetch iPhoneOS SDK
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git sdks
          cd sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          ls -d *.sdk
          du -sh *.sdk

      - name: Build
        run: |
          SDK="$PWD/sdks/iPhoneOS16.5.sdk"
          set +e
          clang -target arm64e-apple-ios16.0 \
            -isysroot "$SDK" \
            -F"$SDK/System/Library/Frameworks" \
            -dynamiclib -fobjc-arc -O2 \
            -fuse-ld=lld \
            -Wl,-undefined,dynamic_lookup \
            -framework Foundation \
            -framework CoreFoundation \
            -o collector.dylib collector/collector.m 2>&1 | tee build.log | tail -30
          echo "exit=$?"
          ls -l collector.dylib 2>/dev/null || echo "NO OUTPUT"

      - name: Inspect
        run: |
          file collector.dylib || true
          xxd -l 8 collector.dylib || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-out
          path: |
            collector.dylib
            build.log