name: build-collector

on:
  workflow_dispatch:
  push:
    paths:
      - 'collector/**'
      - '.github/workflows/build-collector.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang + lld
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld
          clang --version | head -2
          ld.lld --version

      - name: Fetch iPhoneOS SDK
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git sdks
          cd sdks && git sparse-checkout set iPhoneOS16.5.sdk
          ls -d *.sdk

      - name: Build
        run: |
          SDK="$PWD/sdks/iPhoneOS16.5.sdk"
          set +e
          clang -target arm64e-apple-ios16.0 \
            -isysroot "$SDK" \
            -dynamiclib -fobjc-arc -O2 \
            -fno-constant-cfstrings \
            -fuse-ld=lld \
            -Wl,-undefined,dynamic_lookup \
            -Wl,-platform_version,ios,16.0,16.5 \
            -framework Foundation \
            -framework CoreFoundation \
            -o collector.dylib collector/collector.m 2>&1 | tee build.log | tail -25
          ls -l collector.dylib 2>/dev/null || echo "NO OUTPUT"

      - name: Inspect
        run: |
          file collector.dylib || true
          python3 -c "
import struct,sys
d=open('collector.dylib','rb').read()
print('magic', d[:4].hex())
print('cputype', hex(struct.unpack('<I', d[4:8])[0]))
print('size', len(d))
" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-out
          path: |
            collector.dylib
            build.log