name: build-collector

on:
  workflow_dispatch:
  push:
    paths:
      - 'collector/**'
      - '.github/workflows/build-collector.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld make git
          clang --version
          ld.lld --version

      - name: Fetch iPhoneOS SDK (theos)
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$HOME/sdks"
          cd "$HOME/sdks"
          git sparse-checkout set iPhoneOS16.5.sdk || git sparse-checkout set $(git ls-tree -d --name-only HEAD | grep iPhoneOS | tail -1)
          ls -d "$HOME"/sdks/*.sdk
          SDK=$(ls -d "$HOME"/sdks/*.sdk | tail -1)
          echo "SDK=$SDK" >> $GITHUB_ENV
          ls "$SDK/usr/lib" | head -20 || true

      - name: Compile arm64e dylib
        run: |
          clang -target arm64e-apple-ios16.0 \
            -isysroot "$SDK" \
            -dynamiclib -fobjc-arc -O2 \
            -fuse-ld=lld \
            -Wl,-undefined,dynamic_lookup \
            -framework Foundation \
            -framework CoreFoundation \
            -lsqlite3 \
            -o collector.dylib collector/collector.m 2>&1 | tail -40
          ls -l collector.dylib 2>/dev/null || echo "BUILD FAILED"

      - name: Verify
        run: |
          file collector.dylib || true
          xxd -l 16 collector.dylib || true
          size collector.dylib || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collector-dylib
          path: |
            collector.dylib
            collector.m.log